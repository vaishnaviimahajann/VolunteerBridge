server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router needs this — any path that isn't a real file falls
    # back to index.html so client-side routing takes over
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (they have hashed filenames from
    # Vite's build, so it's safe to cache them long-term)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
