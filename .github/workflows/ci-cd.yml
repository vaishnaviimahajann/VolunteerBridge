name: CI/CD Pipeline

# Runs every time code is pushed to the main branch
on:
  push:
    branches: [main]

jobs:
  # ---------- CI: lint check on the frontend before building anything ----------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run lint
        working-directory: ./frontend
        run: npm run lint

  # ---------- CD: build Docker images and push to DockerHub ----------
  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            vaishmahajan2006/volunteerbridge-backend:latest
            vaishmahajan2006/volunteerbridge-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            vaishmahajan2006/volunteerbridge-frontend:latest
            vaishmahajan2006/volunteerbridge-frontend:${{ github.sha }}

      # ---------- Trigger Render to redeploy with the new images ----------
      # These steps only run once RENDER_DEPLOY_HOOK_BACKEND and
      # RENDER_DEPLOY_HOOK_FRONTEND secrets are added (after Render
      # services are created). Safe to leave in even before that —
      # they'll just fail harmlessly if the secret is empty.
      - name: Trigger Render backend deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND != '' }}
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

      - name: Trigger Render frontend deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND != '' }}
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"