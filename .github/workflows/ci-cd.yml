name: CI/CD Pipeline

# Runs every time code is pushed to the main branch
#
on:
  push:
    branches: [main]

jobs:
  # ---------- CI: lint check on the frontend before building anything ----------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run lint
        working-directory: ./frontend
        run: npm run lint

  # ---------- CD: build Docker images and push to DockerHub ----------
  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            vaishmahajan2006/volunteerbridge-backend:latest
            vaishmahajan2006/volunteerbridge-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            vaishmahajan2006/volunteerbridge-frontend:latest
            vaishmahajan2006/volunteerbridge-frontend:${{ github.sha }}

      # ---------- Trigger Render to redeploy with the new images ----------
      # Safe to run even before RENDER_DEPLOY_HOOK_* secrets are added —
      # the script just prints a message and skips instead of failing.
      - name: Trigger Render backend deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -X POST "$HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_BACKEND not set yet — skipping deploy trigger."
          fi

      - name: Trigger Render frontend deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -X POST "$HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_FRONTEND not set yet — skipping deploy trigger."
          fi
          